<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Fracture Detection System</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            padding: 20px;
        }
        
        .container {
            max-width: 1200px;
            margin: 0 auto;
            background: white;
            border-radius: 15px;
            box-shadow: 0 20px 40px rgba(0,0,0,0.1);
            overflow: hidden;
        }
        
        .header {
            background: linear-gradient(135deg, #2c3e50, #34495e);
            color: white;
            padding: 30px;
            text-align: center;
        }
        
        .header h1 {
            font-size: 2.5em;
            margin-bottom: 10px;
        }
        
        .header p {
            opacity: 0.9;
            font-size: 1.1em;
        }
        
        .content {
            padding: 40px;
        }
        
        .upload-section {
            background: #f8f9fa;
            border-radius: 10px;
            padding: 30px;
            margin-bottom: 30px;
            text-align: center;
        }
        
        .file-input-wrapper {
            position: relative;
            display: inline-block;
            margin: 20px 0;
        }
        
        .file-input {
            display: none;
        }
        
        .file-label {
            background: linear-gradient(135deg, #667eea, #764ba2);
            color: white;
            padding: 15px 30px;
            border-radius: 50px;
            cursor: pointer;
            transition: all 0.3s ease;
            display: inline-block;
            font-weight: 500;
        }
        
        .file-label:hover {
            transform: translateY(-2px);
            box-shadow: 0 10px 20px rgba(0,0,0,0.2);
        }
        
        .upload-btn {
            background: linear-gradient(135deg, #28a745, #20c997);
            color: white;
            border: none;
            padding: 15px 30px;
            border-radius: 50px;
            cursor: pointer;
            font-size: 16px;
            font-weight: 500;
            margin-left: 15px;
            transition: all 0.3s ease;
        }
        
        .upload-btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 10px 20px rgba(0,0,0,0.2);
        }
        
        .upload-btn:disabled {
            background: #6c757d;
            cursor: not-allowed;
            transform: none;
        }
        
        .loading {
            display: none;
            margin: 20px 0;
        }
        
        .spinner {
            border: 4px solid #f3f3f3;
            border-top: 4px solid #667eea;
            border-radius: 50%;
            width: 40px;
            height: 40px;
            animation: spin 1s linear infinite;
            margin: 0 auto;
        }
        
        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }
        
        .results-section {
            margin-top: 30px;
        }
        
        .results-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 30px;
            margin-top: 20px;
        }
        
        .image-container {
            text-align: center;
        }
        
        .result-image {
            max-width: 100%;
            height: auto;
            border-radius: 10px;
            box-shadow: 0 10px 20px rgba(0,0,0,0.1);
        }
        
        .detections-container {
            background: #f8f9fa;
            border-radius: 10px;
            padding: 20px;
        }
        
        .detection-item {
            background: white;
            border-radius: 8px;
            padding: 15px;
            margin-bottom: 10px;
            border-left: 4px solid #667eea;
        }
        
        .detection-class {
            font-weight: bold;
            color: #2c3e50;
            font-size: 1.1em;
        }
        
        .detection-confidence {
            color: #28a745;
            font-weight: 500;
        }
        
        .detection-bbox {
            color: #6c757d;
            font-size: 0.9em;
            margin-top: 5px;
        }
        
        .summary {
            background: linear-gradient(135deg, #28a745, #20c997);
            color: white;
            padding: 20px;
            border-radius: 10px;
            text-align: center;
            margin-bottom: 20px;
        }
        
        .error {
            background: #dc3545;
            color: white;
            padding: 15px;
            border-radius: 8px;
            margin: 20px 0;
        }
        
        @media (max-width: 768px) {
            .results-grid {
                grid-template-columns: 1fr;
            }
            
            .content {
                padding: 20px;
            }
            
            .header {
                padding: 20px;
            }
            
            .header h1 {
                font-size: 2em;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <h1>🔍 Fracture Detection System</h1>
            <p>Upload medical images to detect and analyze fractures using AI-powered detection</p>
        </div>
        
        <div class="content">
            <div class="upload-section">
                <h2>Upload Medical Image</h2>
                <p>Select an image file (PNG, JPG, JPEG, GIF, BMP, TIFF)</p>
                
                <div class="file-input-wrapper">
                    <input type="file" id="fileInput" class="file-input" accept="image/*">
                    <label for="fileInput" class="file-label">Choose File</label>
                    <button onclick="uploadFile()" class="upload-btn" id="uploadBtn" disabled>Analyze Image</button>
                </div>
                
                <div id="fileName" style="margin-top: 10px; color: #6c757d;"></div>
                
                <div class="loading" id="loading">
                    <div class="spinner"></div>
                    <p>Analyzing image for fractures...</p>
                </div>
            </div>
            
            <div id="results" class="results-section" style="display: none;">
                <div id="summary" class="summary"></div>
                
                <div class="results-grid">
                    <div class="image-container">
                        <h3>Detected Fractures</h3>
                        <img id="resultImage" class="result-image" alt="Detection Results">
                    </div>
                    
                    <div class="detections-container">
                        <h3>Detection Details</h3>
                        <div id="detectionsList"></div>
                    </div>
                </div>
            </div>
            
            <div id="error" class="error" style="display: none;"></div>
        </div>
    </div>

    <script>
        const fileInput = document.getElementById('fileInput');
        const uploadBtn = document.getElementById('uploadBtn');
        const fileName = document.getElementById('fileName');
        const loading = document.getElementById('loading');
        const results = document.getElementById('results');
        const error = document.getElementById('error');

        fileInput.addEventListener('change', function(e) {
            if (e.target.files.length > 0) {
                fileName.textContent = `Selected: ${e.target.files[0].name}`;
                uploadBtn.disabled = false;
            } else {
                fileName.textContent = '';
                uploadBtn.disabled = true;
            }
        });

        async function uploadFile() {
            const file = fileInput.files[0];
            if (!file) return;

            const formData = new FormData();
            formData.append('file', file);

            // Show loading, hide results and errors
            loading.style.display = 'block';
            results.style.display = 'none';
            error.style.display = 'none';
            uploadBtn.disabled = true;

            try {
                const response = await fetch('/upload', {
                    method: 'POST',
                    body: formData
                });

                const data = await response.json();

                if (data.success) {
                    displayResults(data);
                } else {
                    showError(data.error || 'An error occurred during processing');
                }
            } catch (err) {
                showError('Network error: ' + err.message);
            } finally {
                loading.style.display = 'none';
                uploadBtn.disabled = false;
            }
        }

        function displayResults(data) {
            // Show summary
            const summary = document.getElementById('summary');
            summary.innerHTML = `
                <h2>Analysis Complete!</h2>
                <p>Found ${data.total_fractures} fracture(s) in the uploaded image</p>
            `;

            // Show annotated image
            const resultImage = document.getElementById('resultImage');
            resultImage.src = 'data:image/jpeg;base64,' + data.image;

            // Show detection details
            const detectionsList = document.getElementById('detectionsList');
            if (data.detections.length > 0) {
                detectionsList.innerHTML = data.detections.map(detection => `
                    <div class="detection-item">
                        <div class="detection-class">${detection.class}</div>
                        <div class="detection-confidence">Confidence: ${(detection.confidence * 100).toFixed(1)}%</div>
                        <div class="detection-bbox">
                            Bounding Box: [${detection.bbox.map(x => x.toFixed(1)).join(', ')}]
                        </div>
                    </div>
                `).join('');
            } else {
                detectionsList.innerHTML = '<p>No fractures detected in this image.</p>';
            }

            results.style.display = 'block';
        }

        function showError(message) {
            error.textContent = message;
            error.style.display = 'block';
        }
    </script>
</body>
</html>
